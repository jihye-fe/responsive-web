<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 하루 팝업 창 닫기</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <style>
        * {
            padding: 0; margin: 0;
            box-sizing: border-box;
        }
        
        .popup-wrap input{
            display: none;
        }

        .popup-wrap {
            position: fixed;
            left: 0; right: 0;
            top: 0; bottom: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.7);
            /* width: 100%;
            height: 100vh; 화면의높이? */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .popup-wrap .popup-box {
            width: 400px;
            /* background-color: white; */
            display: flex;
            flex-direction: column; /* row */
            /* position: relative; */
            padding: 0 10px;
        }
    
        .popup-wrap .popup-box .popup-tit {
            font-size: 35px;
            font-weight: 700;
            margin: 0 auto 30px;
            color: #fff;
        }

        .popup-wrap .popup-box .popup-area {
            width: 100%;
        }

        .popup-wrap .popup-box .close-btn {
            color: #fff;
            display: flex;
            align-items: center;
            font-size: 15px;
        }

        .popup-wrap .popup-box .cont { flex: 1; display: flex; }
        .popup-wrap .popup-box .cont .img-mask {
            overflow: hidden;
            position: relative;
        }
        .popup-wrap .popup-box .cont .img-mask img {
            width: 100%;
        }
        .popup-wrap .popup-box .controls { font-size: 15px; display: flex; gap: 16px; justify-content: center; }
        .popup-wrap .popup-box .controls .btn { padding: 12px 20px; background-color: #000; border-radius: 40px; color: #fff; }
       
        .popup-wrap .popup-box .controls .btn label {
            display: flex;
            align-items: center;
        }
        
        /* 체크박스 배경 생성 */
        .popup-wrap .popup-box label::before {
            content: "";
            display: inline-block;
            width: 25px;
            height: 25px;
            background: url(images/icon/check-box-w.svg) no-repeat;
            background-size: 25px 25px;
        }

        .popup-wrap .popup-box label.check::before {
            background-image: url(images/icon/check-box-on-w.svg);
        }
        

        /* 스와이퍼 */

        html, body {
        position: relative;
        }

        .popup-wrap .swiper {
        width: 100%;
        height: 100%;
        }

        .popup-wrap .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .popup-wrap .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        }

        .popup-wrap .swiper-button-next, .swiper-button-prev {
            background-color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 60px;
            padding: 10px;
            border: 1px solid #D0D5DD;
            color: #333;
        }

        .popup-wrap .swiper-button-prev.swiper-button-disabled {
            display: none;
        }
        .popup-wrap .swiper-button-next.swiper-button-disabled {
            display: none;
        }

        .popup-wrap .popup-box .swiper-pagination {
            position: relative;
            bottom: 0;
            margin: 15px 0;
        }

        .popup-wrap .popup-box .swiper-pagination-bullet {
            background: #999;
        }

        .popup-wrap .popup-box .swiper-pagination-bullet-active {
            background: #fff;
        }

        /* 테블릿~pc */
        @media screen and (min-width: 650px){
            .popup-wrap .popup-box { width: 800px; }
            .popup-wrap .swiper-button-prev, .popup-wrap .swiper-button-next {
                display: none;
            }
        }


    </style>

</head>
<body>
    <div class="popup-wrap"> <!-- 검은 화면 -->
            <div class="popup-box"> <!-- 팝업, 버튼(전부) 감싸는 -->
                <p class="popup-tit">온통청년 POPUP</p>
                <div class="popup-area swiper popup-swiper"> <!-- 팝업 영역 -->
                    <div class="cont swiper-wrapper">
                        <div class="img-mask swiper-slide"><img src="images/popup/1.jpg"></div>
                        <div class="img-mask swiper-slide"><img src="images/popup/2.png"></div>
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
                <div class="controls">
                        <div class="btn">
                            <label>
                                <input type="checkbox">
                                오늘 하루 팝업 창 안보기
                            </label>
                        </div>
                        <div class="btn">
                            <button class="close-btn"><img src="images/icon/close-w.svg" alt="닫기" class="icon-s">닫기</button>
                        </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
    </div>

    <script>
        // 현재 시간 < 종료 시간(2026,5,15,23,59,59)
        const today = new Date();
        // console.log(today);
        const year = today.getFullYear();
        const month = today.getMonth();
        const date = today.getDate();

        const popupWrap = document.querySelector(".popup-wrap");
        const closeBtn = popupWrap.querySelector(".close-btn");
        const checkBox = popupWrap.querySelector("input");
        const label = popupWrap.querySelector("label");
        // 닫기 버튼 클릭
        closeBtn.addEventListener("click", function(){

            if(checkBox.checked){
                // 오늘 자정전까지만 팝업 숨기기 (팝업이 종료되는 시간)
                const endDate = new Date(year, month, date, 15, 57, 59);

                // 로컬스토리지에 저장
                localStorage.setItem("popupEnd", endDate);
            }
            popupWrap.style.display = "none"
        });

        // 체크박스 off/on - change
        checkBox.addEventListener("change", function(){
            console.log(checkBox.checked); // true 또는 false
            if(checkBox.checked){
                label.classList.add("check");
            }else{
                label.classList.remove("check");
            }
        })

        const popupEnd = localStorage.getItem("popupEnd");
        if(popupEnd){
            // 저장된 시간
            const endDate = new Date(popupEnd);

            if(today < endDate){
                popupWrap.style.display = "none";
            }
        }

        // 스와이퍼
        var swiper = new Swiper(".popup-swiper", {
        spaceBetween: 30,
        centeredSlides: true,
        autoplay: {
            delay: 2500,
            disableOnInteraction: true,
        },
        pagination: {
            el: ".popup-swiper .swiper-pagination",
            clickable: true,
        },
        navigation: {
            nextEl: ".popup-wrap .swiper-button-next",
            prevEl: ".popup-wrap .swiper-button-prev",
        },
        breakpoints: {
            650 : {
                slidesPerView: 2,
                navigation: false,
                centeredSlides: false
            }
        },
        });
    </script>
</body>
</html>
